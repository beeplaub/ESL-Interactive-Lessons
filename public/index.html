<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BrenUp</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 8px 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .error-box {
      display: none;
      margin-top: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 16px;
      border-radius: 12px;
      width: 100%;
    }
    .btn-retry {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 24px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="brand/icon-192.png" alt="BrenUp Logo" class="logo" onerror="this.style.display='none'">
    <div id="loading-state">
      <div class="spinner"></div>
      <h1>Connecting to BrenUp...</h1>
      <p>Preparing your interactive learning experience.</p>
    </div>
    <div id="error-state" class="error-box">
      <h2 style="font-size: 1.15rem; color: #f87171; margin-bottom: 6px;">Connection Unavailable</h2>
      <p>Unable to connect to BrenUp online services. Please check your internet connection.</p>
      <button class="btn-retry" onclick="attemptConnect()">Try Again</button>
    </div>
  </div>

  <script>
    const TARGET_URL = 'https://www.brenup.com';

    function attemptConnect() {
      document.getElementById('loading-state').style.display = 'block';
      document.getElementById('error-state').style.display = 'none';

      if (!navigator.onLine) {
        showError();
        return;
      }

      // Check reachability or redirect
      window.location.replace(TARGET_URL);
    }

    function showError() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
    }

    window.addEventListener('offline', showError);
    window.addEventListener('online', attemptConnect);

    // Initial connection attempt
    setTimeout(attemptConnect, 100);
  </script>
</body>
</html>
