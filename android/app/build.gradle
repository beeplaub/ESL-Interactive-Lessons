apply plugin: 'com.android.application'

def releaseSigningEnabled = providers.gradleProperty('brenupReleaseSigning')
        .map { it.toBoolean() }
        .getOrElse(false)
def releaseSigningEnvironment = [:]
def missingReleaseSigningValues = []

if (releaseSigningEnabled) {
    releaseSigningEnvironment = [
            storeFile: 'BRENUP_UPLOAD_STORE_FILE',
            storePassword: 'BRENUP_UPLOAD_STORE_PASSWORD',
            keyAlias: 'BRENUP_UPLOAD_KEY_ALIAS',
            keyPassword: 'BRENUP_UPLOAD_KEY_PASSWORD'
    ].collectEntries { name, environmentVariable ->
        [name, providers.environmentVariable(environmentVariable).orNull]
    }
    missingReleaseSigningValues = releaseSigningEnvironment.findAll { name, value -> !value }
            .keySet()
            .collect { name -> name }
}

android {
    namespace = "com.brenup.app"
    compileSdk = rootProject.ext.compileSdkVersion
    sourceSets {
        main {
            // The native shell loads BrenUp over HTTPS and keeps its offline
            // message inline; it has no bundled WebView asset entry point.
            assets.srcDirs = []
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        if (releaseSigningEnabled && missingReleaseSigningValues.isEmpty()) {
            ownerUpload {
                storeFile file(releaseSigningEnvironment.storeFile)
                storePassword releaseSigningEnvironment.storePassword
                keyAlias releaseSigningEnvironment.keyAlias
                keyPassword releaseSigningEnvironment.keyPassword
            }
        }
    }
    defaultConfig {
        applicationId "com.brenup.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningEnabled && missingReleaseSigningValues.isEmpty()) {
                signingConfig signingConfigs.ownerUpload
            }
        }
    }
}

if (releaseSigningEnabled && !missingReleaseSigningValues.isEmpty()) {
    throw new GradleException(
            "Release signing was explicitly enabled, but required values are missing: ${missingReleaseSigningValues.join(', ')}. " +
                    'Provide them through the documented secure local or CI environment.'
    )
}

dependencies {
    implementation 'androidx.browser:browser:1.9.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
