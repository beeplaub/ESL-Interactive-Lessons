<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcf8ff">
  <title>BrenUp Loading Animation — Mock</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #fcf8ff;
      --ink: #282848;
      --muted: #737287;
      --brand: #3e3a72;
      --violet: #6c3bff;
      --coral: #ff7a59;
      --teal: #39b9ae;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; color: var(--ink);
      background: radial-gradient(ellipse at 50% 44%, #f0ebff 0, transparent 26rem), linear-gradient(145deg, #fcf8ff, #f8f5fc);
    }
    header { display: flex; align-items: center; justify-content: space-between; padding: 21px clamp(20px, 5vw, 68px); }
    .brand-logo { display: block; width: 128px; height: auto; object-fit: contain; }
    .preview { color: #9693a6; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    main { display: grid; min-height: calc(100vh - 70px); place-items: center; padding: 20px; }
    .loader-card { width: min(100%, 430px); padding: 31px 24px 35px; border: 1px solid rgba(62,58,114,.08); border-radius: 28px; background: rgba(255,255,255,.76); box-shadow: 0 22px 70px rgba(40,35,90,.08); text-align: center; backdrop-filter: blur(10px); }
    .solar-system { position: relative; width: 250px; height: 190px; margin: 0 auto 17px; }
    .orbit {
      position: absolute; top: 50%; left: 50%; border: 1px solid rgba(108,59,255,.19); border-radius: 50%;
      transform: translate(-50%,-50%) rotate(var(--tilt)); animation: orbit-spin var(--speed) linear infinite;
    }
    .orbit-one { --tilt: -24deg; --speed: 13s; width: 138px; height: 82px; }
    .orbit-two { --tilt: 38deg; --speed: 19s; width: 190px; height: 116px; border-color: rgba(255,122,89,.2); animation-direction: reverse; }
    .orbit-three { --tilt: -58deg; --speed: 26s; width: 236px; height: 148px; border-color: rgba(57,185,174,.2); }
    .planet { position: absolute; top: -12px; left: 50%; display: grid; min-width: 30px; height: 24px; place-items: center; padding: 0 6px; border: 2px solid white; border-radius: 999px; color: white; font-size: 9px; font-weight: 900; box-shadow: 0 4px 12px rgba(40,35,90,.13); transform: translateX(-50%); }
    .orbit-one .planet { background: var(--coral); }
    .orbit-two .planet { background: var(--teal); }
    .orbit-three .planet { background: #e4ad36; }
    .sun {
      position: absolute; top: 50%; left: 50%; display: grid; width: 68px; height: 68px; place-items: center; overflow: hidden;
      border: 3px solid white; border-radius: 23px; background: #282848; box-shadow: 0 12px 28px rgba(40,35,90,.22), 0 0 35px rgba(108,59,255,.17);
      transform: translate(-50%,-50%); animation: sun-float 3s ease-in-out infinite;
    }
    .sun img { width: 100%; height: 100%; object-fit: cover; }
    .caption { margin: 0; color: var(--brand); font-size: 14px; font-weight: 700; }
    .wave { display: flex; height: 18px; align-items: center; justify-content: center; gap: 4px; margin-top: 10px; }
    .wave i { display: block; width: 3px; height: 5px; border-radius: 99px; background: linear-gradient(var(--violet), var(--coral)); animation: wave 1s ease-in-out infinite; }
    .wave i:nth-child(2) { animation-delay: .12s; }
    .wave i:nth-child(3) { animation-delay: .24s; }
    .wave i:nth-child(4) { animation-delay: .36s; }
    .wave i:nth-child(5) { animation-delay: .48s; }
    @keyframes orbit-spin { from { transform: translate(-50%,-50%) rotate(var(--tilt)); } to { transform: translate(-50%,-50%) rotate(calc(var(--tilt) + 360deg)); } }
    @keyframes sun-float { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-53%) scale(1.035); } }
    @keyframes wave { 0%,100% { height: 5px; opacity: .62; } 50% { height: 16px; opacity: 1; } }
    @media (max-width: 520px) {
      header { padding: 16px 18px; }
      .brand-logo { width: 108px; }
      main { min-height: calc(100svh - 60px); padding: 16px; }
      .loader-card { width: min(100%, 320px); padding: 20px 16px 22px; border-radius: 22px; }
      .solar-system { width: 184px; height: 136px; margin-bottom: 12px; }
      .orbit-one { width: 104px; height: 64px; }
      .orbit-two { width: 142px; height: 88px; }
      .orbit-three { width: 174px; height: 112px; }
      .sun { width: 58px; height: 58px; border-radius: 20px; }
      .caption { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <header>
    <img class="brand-logo" src="../../public/brand/logo-horizontal-light.png" alt="BrenUp">
    <span class="preview">Loading preview</span>
  </header>
  <main>
    <section class="loader-card" role="status" aria-live="polite" aria-label="Getting your page ready">
      <div class="solar-system" aria-hidden="true">
        <div class="orbit orbit-one"><span class="planet">/iː/</span></div>
        <div class="orbit orbit-two"><span class="planet">/ʃ/</span></div>
        <div class="orbit orbit-three"><span class="planet">/uː/</span></div>
        <span class="sun"><img src="../../public/brand/app-icon.png" alt=""></span>
      </div>
      <p class="caption">Getting your page ready…</p>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </section>
  </main>
</body>
</html>
